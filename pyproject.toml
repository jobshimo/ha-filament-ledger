[project]
name = "filament-ledger"
version = "0.1.0"
description = "Home Assistant custom integration that tracks remaining filament with an append-only ledger"
requires-python = ">=3.14.2"
dependencies = []

# The integration itself declares no runtime dependencies. See docs/11-development.md §11.2.

[dependency-groups]
# Everything needed to develop and test the domain and application layers.
# Deliberately does NOT include homeassistant: docs/03-architecture.md §3.2 requires those
# layers to be testable without it, and a dependency group is the cheapest way to prove it.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "mypy>=1.14",
    "ruff>=0.9",
]

# Only the integration tests need Home Assistant. Phase 2 onward.
ha = [
    "homeassistant==2026.7.4",
    # Floor pinned deliberately: this plugin tracks Home Assistant release-for-release, so
    # an unconstrained resolve can silently adopt a version built for a different core.
    "pytest-homeassistant-custom-component>=0.13.348",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "C4",          # comprehensions
    "SIM",         # simplify
    "PT",          # pytest style
    "PTH",         # use pathlib
    "TID",         # tidy imports
    "ANN",         # annotations — every signature is typed
    "ASYNC",       # blocking calls inside coroutines (ADR-0005)
    "RUF",         # ruff-specific
]
ignore = [
    "E501",        # line length is enforced by the formatter
    # Relative imports are how a Home Assistant custom component refers to itself; the
    # integration directory is not importable by an absolute path outside HA's loader.
    "TID252",
    # The prose in this project uses typographic minus and arrows. That is deliberate.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]
# The adapter suite tests the Home Assistant boundary, so it is allowed to see Home
# Assistant — the no-HA CI job never collects it (it runs tests/domain and
# tests/architecture only), which keeps the "domain runs without HA" claim observable.
"tests/ha/**" = ["ANN401", "TID251"]
# Infrastructure is the layer that is *supposed* to know Home Assistant exists. The ban
# below is what keeps it out of domain/ and application/; this allow-list names the entire
# boundary, and it is short on purpose — if it grows, the boundary has moved.
"custom_components/filament_ledger/__init__.py" = ["TID251"]
"custom_components/filament_ledger/config_flow.py" = ["TID251"]
"custom_components/filament_ledger/sensor.py" = ["TID251"]
"custom_components/filament_ledger/infrastructure/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A fast pre-check. The real enforcement is tests/architecture/test_layers.py, which walks
# the AST and cannot be silenced by an ignore comment.
"homeassistant".msg = "Infrastructure only. See docs/03-architecture.md §3.2."

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------------------
# Mypy — docs/11-development.md §11.3
# --------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_any_explicit = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
files = ["custom_components", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Home Assistant re-exports through package __init__ files without __all__. That is its
# convention, not a defect, and mypy's no_implicit_reexport is the wrong tool to point at
# somebody else's codebase.
module = ["homeassistant.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# The Home Assistant boundary speaks an untyped wire protocol: websocket payloads are
# dicts, service call data is a dict, entity attributes are a dict. Insisting on
# disallow_any_explicit here would mean inventing TypedDicts for shapes Home Assistant
# itself types as Any — ceremony that buys nothing and obscures the translation.
#
# Strictness stays absolute where the rules live. domain/ and application/ get no relief,
# and that is the half where `Grams` has to hold.
module = [
    "custom_components.filament_ledger.__init__",
    "custom_components.filament_ledger.config_flow",
    "custom_components.filament_ledger.sensor",
    "custom_components.filament_ledger.infrastructure.ha.*",
]
disallow_any_explicit = false

# --------------------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# `pytest-homeassistant-custom-component` autoloads a plugin that imports `fcntl`, so it
# cannot even be imported on Windows. Nothing in these suites needs it — which is the
# architecture's claim, not a workaround. Phase 2's integration tests will run under their
# own invocation with the plugin enabled.
addopts = "-p no:homeassistant"
# A forgotten `await` produces a use case that silently does nothing — the ledger's worst
# failure mode, since it leaves no entry and no error. See docs/11-development.md §11.4.
filterwarnings = ["error::RuntimeWarning"]
